<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <defs>
    <marker id="aDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  </defs>

  <rect width="1120" height="450" fill="#f8fafc"/>

  <!-- ============ Linux server ============ -->
  <rect x="20" y="20" width="330" height="300" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="44" y="58" font-size="24" font-weight="700" fill="#0f172a">Linux test server</text>
  <text x="44" y="84" font-size="16" fill="#475569">C · POSIX threads</text>
  <g fill="#ffffff" stroke="#1d4ed8" stroke-width="2">
    <rect x="44" y="105" width="282" height="46" rx="10"/>
    <rect x="44" y="175" width="282" height="46" rx="10"/>
    <rect x="44" y="245" width="282" height="46" rx="10"/>
  </g>
  <g font-size="18" font-weight="700" fill="#1e3a8a" text-anchor="middle">
    <text x="185" y="134">Command generator</text>
    <text x="185" y="204">UDP RX thread</text>
    <text x="185" y="274">Response writer thread</text>
  </g>
  <line x1="185" y1="223" x2="185" y2="241" stroke="#334155" stroke-width="2" marker-end="url(#aDark)"/>

  <!-- ============ SQLite ============ -->
  <rect x="20" y="345" width="330" height="85" rx="14" fill="#f1f5f9" stroke="#334155" stroke-width="2.5"/>
  <text x="185" y="380" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">SQLite</text>
  <text x="185" y="410" font-size="16" fill="#475569" text-anchor="middle">every test: timestamps, PASS / FAIL</text>
  <line x1="120" y1="322" x2="120" y2="341" stroke="#334155" stroke-width="2.5" marker-end="url(#aDark)"/>
  <text x="134" y="337" font-size="14" font-weight="600" fill="#334155">insert / update</text>

  <!-- ============ STM32 firmware ============ -->
  <rect x="470" y="20" width="630" height="410" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="494" y="58" font-size="24" font-weight="700" fill="#0f172a">STM32F756ZG firmware</text>
  <text x="494" y="84" font-size="16" fill="#475569">Nucleo-144 · FreeRTOS · lwIP · HAL · C</text>

  <g fill="#ffffff" stroke="#ea580c" stroke-width="2">
    <rect x="495" y="100" width="170" height="56" rx="10"/>
    <rect x="700" y="100" width="170" height="56" rx="10"/>
    <rect x="495" y="315" width="280" height="56" rx="10"/>
  </g>
  <g text-anchor="middle" font-size="18" font-weight="700" fill="#7c2d12">
    <text x="580" y="134">lwIP UDP</text>
    <text x="785" y="134">Dispatcher</text>
    <text x="635" y="349">Response sender task</text>
  </g>
  <text x="885" y="125" font-size="14" fill="#475569">one queue</text>
  <text x="885" y="143" font-size="14" fill="#475569">per test task</text>

  <!-- test tasks -->
  <g fill="#ffffff" stroke="#15803d" stroke-width="2">
    <rect x="495" y="195" width="105" height="80" rx="10"/>
    <rect x="608" y="195" width="105" height="80" rx="10"/>
    <rect x="721" y="195" width="105" height="80" rx="10"/>
    <rect x="834" y="195" width="105" height="80" rx="10"/>
    <rect x="947" y="195" width="105" height="80" rx="10"/>
  </g>
  <g text-anchor="middle">
    <g font-size="19" font-weight="700" fill="#14532d">
      <text x="547" y="230">UART</text>
      <text x="660" y="230">SPI</text>
      <text x="773" y="230">I²C</text>
      <text x="886" y="230">ADC</text>
      <text x="999" y="230">Timer</text>
    </g>
    <g font-size="13" fill="#475569">
      <text x="547" y="256">UART4 ↔ UART5</text>
      <text x="660" y="256">SPI1 ↔ SPI2</text>
      <text x="773" y="256">I2C1 ↔ I2C2</text>
      <text x="886" y="256">DAC → ADC</text>
      <text x="999" y="256">TIM2 timing</text>
    </g>
  </g>

  <!-- loopback note -->
  <rect x="800" y="315" width="275" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="937" y="339" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">Loopback wiring</text>
  <text x="937" y="360" font-size="13" fill="#475569" text-anchor="middle">jumper wires between peripherals</text>

  <!-- flow inside the firmware -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="667" y1="128" x2="696" y2="128" marker-end="url(#aDark)"/>
    <path d="M785,158 L785,178"/>
    <path d="M547,178 L999,178"/>
    <path d="M547,275 L547,295 M660,275 L660,295 M773,275 L773,295 M886,275 L886,295 M999,275 L999,295 M547,295 L999,295"/>
    <line x1="635" y1="295" x2="635" y2="311" marker-end="url(#aDark)"/>
  </g>
  <g stroke="#334155" stroke-width="2" marker-end="url(#aDark)">
    <line x1="547" y1="178" x2="547" y2="191"/>
    <line x1="660" y1="178" x2="660" y2="191"/>
    <line x1="773" y1="178" x2="773" y2="191"/>
    <line x1="886" y1="178" x2="886" y2="191"/>
    <line x1="999" y1="178" x2="999" y2="191"/>
  </g>
  <text x="785" y="405" font-size="15" font-weight="600" fill="#9a3412" text-anchor="middle">IT and DMA modes · random payloads · CRC check · PASS / FAIL</text>

  <!-- ============ UDP ============ -->
  <text x="410" y="80" font-size="18" font-weight="700" fill="#1d4ed8" text-anchor="middle">UDP</text>
  <text x="410" y="98" font-size="13" fill="#1d4ed8" text-anchor="middle">Ethernet</text>
  <line x1="328" y1="128" x2="491" y2="128" stroke="#1d4ed8" stroke-width="3" marker-end="url(#aBlue)"/>
  <text x="410" y="120" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">COMMAND</text>
  <path d="M493,343 L410,343 L410,198 L330,198" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#aBlue)"/>
  <text x="418" y="300" font-size="13" font-weight="700" fill="#1d4ed8">RESULT</text>
</svg>
